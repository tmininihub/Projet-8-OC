name: CI-CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: scoring-api
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    env:
      URLBDD: ${{ secrets.URLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: python -m pytest --cov=main --cov-report=term-missing --cov-report=xml

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    needs: test
    runs-on: self-hosted
    timeout-minutes: 720
    env:
      URLBDD: ${{ secrets.DockerURLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Nettoyer l'ancien conteneur
        run: docker rm -f scoring-api
        continue-on-error: true

      - name: Construire l'image Docker
        run: docker build -t scoring-api .

      - name: Lancer l'API (Docker, en arrière-plan)
        run: docker run -d -p 8000:8000 -e URLBDD --name scoring-api scoring-api

      - name: Vérifier que l'API répond
        run: |
          Start-Sleep -Seconds 10
          Invoke-WebRequest -Uri http://localhost:8000/docs -UseBasicParsing

      - name: Afficher les logs du conteneur
        if: always()
        run: docker logs scoring-api

      - name: API en ligne, attente de l'arrêt (docker stop scoring-api)
        run: docker wait scoring-api
