name: CI-CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: scoring-api
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    env:
      URLBDD: ${{ secrets.URLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer test_main.py
        run: python -m pytest test_main.py

  deploy:
    needs: test
    runs-on: self-hosted
    timeout-minutes: 720
    env:
      URLBDD: ${{ secrets.DockerURLBDD }}
    steps:
      - uses: actions/checkout@v4

      - name: Nettoyer l'ancien conteneur
        run: docker rm -f scoring-api
        continue-on-error: true

      - name: Construire l'image Docker
        run: docker build -t scoring-api .

      - name: Lancer l'API
        run: docker run -d -p 8000:8000 -e URLBDD --name scoring-api scoring-api

      - name: Vérifier que l'API répond
        run: |
          Start-Sleep -Seconds 10
          Invoke-WebRequest -Uri http://localhost:8000/docs -UseBasicParsing

      - name: Afficher les logs du conteneur
        if: always()
        run: docker logs scoring-api
